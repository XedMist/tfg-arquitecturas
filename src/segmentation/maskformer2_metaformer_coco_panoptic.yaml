# maskformer2_metaformer_tiny_coco_panoptic.yaml
# -----------------------------------------------
# Configuración de Mask2Former para segmentación panóptica en COCO
# usando MetaformerBackbone como extractor de características.
#
# Basado en:
#   configs/coco/panoptic-segmentation/maskformer2_swin_tiny_bs16_50ep.yaml
# Solo cambia la sección MODEL.BACKBONE y MODEL.METAFORMER.

_BASE_: "/opt/Mask2Former/configs/coco/panoptic-segmentation/Base-COCO-PanopticSegmentation.yaml"

MODEL:
  META_ARCHITECTURE: "MaskFormer"
  BACKBONE:
    NAME: "MetaformerBackbone"        # <-- tu backbone registrado
  PIXEL_MEAN: [123.675, 116.280, 103.530]  # media de ImageNet (no tocar)
  PIXEL_STD:  [58.395,  57.120,  57.375]  # std de ImageNet (no tocar)

  # Parámetros propios del backbone
  METAFORMER:
    WEIGHTS: "checkpoints/backbone_gcnn_2/last.ckpt"  # Checkpoint de la config classification_gcnn_2
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    # Canales de salida del Gated CNN (_build_gcnn_backbone)
    OUT_CHANNELS: [96, 192, 384, 576]
    # stride acumulado: stem=4, cada Downsample dobla
    OUT_STRIDES:  [4, 8, 16, 32]

  # Pixel Decoder (MSDeformAttn) — no tocar salvo que cambies la FPN
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 133          # COCO panoptic: 80 things + 53 stuff
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    # Pixel decoder
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_N_POINTS: 4
    DEFORMABLE_TRANSFORMER_ENCODER_N_HEADS: 8
    TRANSFORMER_ENC_LAYERS: 6
    COMMON_STRIDE: 4

  MASK_ON: true

  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: true
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DIM_FEEDFORWARD: 2048
    DEC_LAYERS: 10
    ENFORCE_INPUT_PROJ: false
    TEST:
      SEMANTIC_ON: false
      INSTANCE_ON: false
      PANOPTIC_ON: true
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.00004
  AMP:
    ENABLED: true
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_NORM: 0.0
  OPTIMIZER: "ADAMW"
  BACKBONE_LR_MULTIPLIER: 0.1    # backbone aprende 10x más lento
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  MAX_ITER: 80000               # ~90 épocas con batch 16
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 10
  WARMUP_METHOD: "linear"
  CLIP_GRADIENTS:
    ENABLED: true
    CLIP_TYPE: "norm"
    CLIP_VALUE: 0.01
  CHECKPOINT_PERIOD: 2500

INPUT:
  IMAGE_SIZE: 800
  MIN_SCALE: 0.1
  MAX_SCALE: 2.0
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_panoptic_lsj"   # Large Scale Jitter

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: true
  NUM_WORKERS: 4

DATASETS:
  TRAIN: ("coco_2017_train_panoptic",)
  TEST:  ("coco_2017_val_panoptic",)

TEST:
  EVAL_PERIOD: 2500

OUTPUT_DIR: "./output/metaformer_tiny_coco_panoptic"
