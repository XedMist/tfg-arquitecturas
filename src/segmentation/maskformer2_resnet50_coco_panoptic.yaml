_BASE_: "/opt/Mask2Former/configs/coco/panoptic-segmentation/Base-COCO-PanopticSegmentation.yaml"

MODEL:
  META_ARCHITECTURE: "MaskFormer"
  WEIGHTS: ""
  BACKBONE:
    NAME: "ResNet50Backbone"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD:  [58.395,  57.120,  57.375]

  METAFORMER:
    ARCH_NAME: "resnet50"
    WEIGHTS: "checkpoints/pretrain_resnet50/last.ckpt"
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    OUT_CHANNELS: [256, 512, 1024, 2048]
    OUT_STRIDES:  [4, 8, 16, 32]

  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 133
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_N_POINTS: 4
    DEFORMABLE_TRANSFORMER_ENCODER_N_HEADS: 8
    TRANSFORMER_ENC_LAYERS: 6
    COMMON_STRIDE: 4

  MASK_ON: true

  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: true
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DIM_FEEDFORWARD: 2048
    DEC_LAYERS: 10
    ENFORCE_INPUT_PROJ: false
    TEST:
      SEMANTIC_ON: false
      INSTANCE_ON: true
      PANOPTIC_ON: true
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.00004
  AMP:
    ENABLED: true
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_NORM: 0.0
  OPTIMIZER: "ADAMW"
  BACKBONE_LR_MULTIPLIER: 0.1
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  MAX_ITER: 360000
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 1000
  WARMUP_METHOD: "linear"
  CLIP_GRADIENTS:
    ENABLED: true
    CLIP_TYPE: "norm"
    CLIP_VALUE: 0.01
  CHECKPOINT_PERIOD: 10000

INPUT:
  IMAGE_SIZE: 800
  MIN_SCALE: 0.1
  MAX_SCALE: 2.0
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_panoptic_lsj"

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: true
  NUM_WORKERS: 4

DATASETS:
  TRAIN: ("coco_2017_train_panoptic",)
  TEST:  ("coco_2017_val_panoptic",)

TEST:
  EVAL_PERIOD: 10000

OUTPUT_DIR: "./output/resnet50_coco_panoptic"
