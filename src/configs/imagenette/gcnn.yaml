defaults:
  - _self_
  - override hydra/launcher: basic

experiment:
  name: "gcnn-imagenette"
  task: "classification"
  seed: 42
  deterministic: true
  benchmark: false

model:
  arch: "gcnn-imagenette"
  pretrained: false
  num_classes: 10
  drop_rate: 0.0
  drop_path_rate: 0.1

data:
  name: "imagenette"
  root: "./data/imagenette"
  dataset_type: "imagenette"
  num_classes: 10
  input_size: 160
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  workers: 8
  pin_memory: true
  prefetch_factor: 4
  subset_seed: 42

augmentation:
  train:
    random_resized_crop: 160
    horizontal_flip_p: 0.5
    auto_augment: "rand-m9-mstd0.5-inc1"
    re_prob: 0.25
    mixup_alpha: 0.8
    cutmix_alpha: 1.0
    color_jitter:
      { brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.1, p: 0.8 }
    grayscale_p: 0.02
    gaussian_blur_p: 0.1
  val:
    resize: 256
    center_crop: 160

training:
  epochs: 2
  batch_size: 64
  grad_accumulation_steps: 1
  grad_clip_norm: 1.0
  label_smoothing: 0.1

optimizer:
  name: "adamw"
  lr: 1.0e-3
  weight_decay: 0.05
  betas: [0.9, 0.999]
  eps: 1.0e-8
  layer_decay: null

scheduler:
  name: "cosine"
  warmup_epochs: 5
  warmup_lr_init: 1.0e-6
  min_lr: 1.0e-6

precision:
  amp: true
  compile: false
  compile_mode: "reduce-overhead"
  channels_last: true

ema:
  enabled: true
  decay: 0.9999

checkpoint:
  dir: "checkpoints/${experiment.name}"
  save_top_k: 3
  monitor: "val/acc_top1"
  mode: "max"
  save_last: true
  resume_from: null # path a checkpoint para reanudar

logging:
  wandb:
    enabled: true
    project: "tfg-backbones"
    entity: null # tu usuario de wandb
    tags: ["classification", "from-scratch", "imagenet100"]
    log_model: true
    log_freq: 50 # cada N steps
  tensorboard:
    enabled: true
    log_dir: "runs/${experiment.name}"
  console:
    log_every_n_steps: 10
    progress_bar: true
